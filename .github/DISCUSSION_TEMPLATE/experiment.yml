title: "[LAB] "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your lab work. This space is for documenting Proofs of Concept (PoCs) and modernization experiments to foster collaboration.

  - type: textarea
    id: summary
    attributes:
      label: Experiment Summary
      description: "Describe in 1-2 sentences what this lab case is about and its objective."
    validations:
      required: true

  - type: dropdown
    id: lab-type
    attributes:
      label: Lab Case Type
      description: "Select the main goal of this work."
      options:
        - "Proof of Concept (PoC) (Reusable solution for other clients/projects)"
        - "Stack Modernization (Internal technology improvement/update)"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem or Opportunity
      description: "What specific problem are you solving or what opportunity are you exploring?"
      placeholder: "e.g., 'The current setup for X is manual and error-prone...' or 'Client Y needs Z, and this could be used for everyone...'"
    validations:
      required: true

  - type: textarea
    id: technical-proposal
    attributes:
      label: Technical Proposal / Implementation
      description: "Describe the architecture, services, tools, or configurations you are testing. (You can paste diagrams, code, etc.)"
      render: yaml # You can change this to hcl, bash, etc.
    validations:
      required: true

  - type: textarea
    id: expected-impact
    attributes:
      label: Expected Impact or Success Criteria
      description: "What does success look like for this experiment? How could this benefit other teams or clients?"
      placeholder: "e.g., 'Reduce deployment time by 50%' or 'Create a reusable Terraform module for...'"
    validations:
      required: false

  - type: textarea
    id: discussion-points
    attributes:
      label: Discussion Points or Questions (Invite collaboration!)
      description: "This is the key space. What would you like feedback on? What questions do you have for other teams?"
      placeholder: "Has anyone used this tool before? What do you think of this architecture? Do you see any risks?"
    validations:
      required: false
